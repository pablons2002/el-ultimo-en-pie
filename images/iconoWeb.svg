<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="50%" stop-color="#1b263b" />
      <stop offset="100%" stop-color="#415a77" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5c13" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff9e6" />
      <stop offset="70%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#a0781b" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#skyGrad)" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="225" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="5,10" opacity="0.5" />

  <g opacity="0.25">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="256" cy="256" r="111.2" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="256" cy="256" r="68.7" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="256,76 412,346 100,346" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <line x1="256" y1="16" x2="256" y2="496" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="16" y1="256" x2="496" y2="256" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <g transform="translate(0, 20)">
    <polygon points="136,150 256,60 376,150" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    <polygon points="160,140 256,72 352,140" fill="url(#goldGrad)" opacity="0.2" />
    
    <rect x="146" y="150" width="220" height="14" rx="2" fill="url(#goldGrad)" />

    <rect x="166" y="174" width="20" height="150" fill="url(#goldGrad)" />
    <rect x="216" y="174" width="20" height="150" fill="url(#goldGrad)" />
    <rect x="276" y="174" width="20" height="150" fill="url(#goldGrad)" />
    <rect x="326" y="174" width="20" height="150" fill="url(#goldGrad)" />
    
    <rect x="136" y="324" width="240" height="12" fill="url(#goldGrad)" />
    <rect x="116" y="336" width="280" height="16" fill="url(#goldGrad)" />
  </g>

  <g filter="url(#glow)">
    <polyline points="256,30 340,190 220,240 310,430 190,290 280,240 210,130" 
              fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <polyline points="256,30 340,190 220,240 310,430 190,290 280,240 210,130" 
              fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <path d="M 110,240 C 85,210 55,270 30,240 C 5,210 35,270 110,240 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" transform="translate(80, 140) scale(0.4)" />
  <path d="M 110,240 C 135,210 165,270 190,240 C 215,210 185,270 110,240 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" transform="translate(80, 140) scale(0.4)" />

  <path d="M10,5 L50,5 M20,5 L20,45 M40,5 C40,30 45,40 52,40" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" transform="translate(350, 160) scale(0.7)" />

  <polyline points="10,5 45,5 25,25 45,45 10,45" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(130, 280) scale(0.6)" />

  <path d="M10,25 L20,40 L35,10 L65,10" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(310, 290) scale(0.7)" />
  <text x="345" y="315" fill="#00f2fe" font-family="'Courier New', monospace" font-weight="bold" font-size="18">x</text>

  <circle cx="256" cy="30" r="4" fill="#ffffff" filter="url(#glow)" />
  <circle cx="310" cy="430" r="5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="150" cy="110" r="3" fill="#ffffff" />
  <circle cx="370" cy="100" r="2" fill="#ffffff" />
</svg>
