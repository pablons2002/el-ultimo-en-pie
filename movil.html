<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Móvil - El último en πe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1, , viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="images/iconoWeb.svg">
</head>

<body>
  <header id="userHeader">
    <img src="images/iconoWeb.svg" width="40">
    👤 <span id="userNameHeader"></span>
  </header>
  <h1>El último en pi e</h1>

  <!--firebase-->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPpKax_7zzPteOtnnutKX6anU6xqgfoMw",
      authDomain: "el-ultimo-en-pie-matematikos.firebaseapp.com",
      projectId: "el-ultimo-en-pie-matematikos",
      storageBucket: "el-ultimo-en-pie-matematikos.firebasestorage.app",
      messagingSenderId: "984317427914",
      appId: "1:984317427914:web:c9fcf803d20186494b3433"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
  </script>
  <script type="module" src="app.js"></script>
  <!-- Selección de personaje -->
  <div id="screenSelect"></div>

  <!-- Pantalla de espera después de selección de personaje, hasta que se pulse botón de empezar en tv-->
  <div id="screenWaiting" style="display:none; text-align: center; margin-top: 50px;">
    Esperando a que empiece la partida...
  </div>




  <!--Pantalla Ranking-->
  <div id="screenRanking" style="display:none;">
    <h3 style="text-align: center;">Ranking</h3>
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Participante</th>
          <th>Puntuación</th>
        </tr>
      </thead>
      <tbody id="listaRankingActivos"></tbody>
    </table>
  </div>


  <!-- Pantalla del juego -->
  <div id="screenGame" style="display:none;">
    <h2 id="playerName" style="border-bottom: 1px dashed #555; padding-bottom: 5px;">Juegos</h2>
  </div>


  <!-- 1º Juego WorldGuessr personalizado -->
  <div id="screenWorldGuessr" style="display: none;">
    <iframe src="https://www.worldguessr.com/"></iframe>
  </div>

  <!-- 2º Juego SongGuessr-->
  <div id="screenGuessSong" class="mobile-screen" style="display: none;">
    <h3>¿De quién es la canción?</h3>
    <button onclick="enviarSospechoso('Pablo')">Pablo</button>
    <button onclick="enviarSospechoso('Inés')">Inés</button>

    <hr>

    <h3>¿Qué canción es?</h3>
    <input type="text" id="mobileSongInput" placeholder="Título...">
    <button id="sendSongBtn">Enviar</button>
  </div>

</body>

</html>
