<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Móvil - El último en πe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1, , viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="images/iconoWeb.svg">
</head>

<body>
  <header id="userHeader">
    <img src="images/iconoWeb.svg" width="40">
    👤 <span id="userNameHeader"></span>
  </header>
  <h1>El último en pi e</h1>

  <!--firebase-->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPpKax_7zzPteOtnnutKX6anU6xqgfoMw",
      authDomain: "el-ultimo-en-pie-matematikos.firebaseapp.com",
      projectId: "el-ultimo-en-pie-matematikos",
      storageBucket: "el-ultimo-en-pie-matematikos.firebasestorage.app",
      messagingSenderId: "984317427914",
      appId: "1:984317427914:web:c9fcf803d20186494b3433"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
  </script>
  <script type="module" src="app.js"></script>
  <!-- Selección de personaje -->
  <div id="screenSelect"></div>

  <!-- Pantalla de espera después de selección de personaje, hasta que se pulse botón de empezar en tv-->
  <div id="screenWaiting" style="display:none; text-align: center; margin-top: 50px;">
    Esperando a que empiece la partida...
  </div>




  <!--Pantalla Ranking-->
  <div id="screenRanking" style="display:none;">
    <h3 style="text-align: center;">Ranking</h3>
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Participante</th>
          <th>Puntuación</th>
        </tr>
      </thead>
      <tbody id="listaRankingActivos"></tbody>
    </table>
  </div>

  <!-- 1º Juego WorldGuessr personalizado -->
  <div id="screenWorldGuessr" style="display: none;">
    <iframe src="https://www.worldguessr.com/"></iframe>
  </div>

  <!-- 2º Juego SongGuessr-->
  <div id="screenGuessSong" class="mobile-screen" style="display: none;">
    <h3>¿De quién es la canción?</h3>
    <button onclick="enviarSospechoso('Pablo')">Pablo</button>
    <button onclick="enviarSospechoso('Inés')">Inés</button>

    <hr>

    <h3>¿Qué canción es?</h3>
    <input type="text" id="mobileSongInput" placeholder="Título...">
    <button id="sendSongBtn">Enviar</button>
  </div>

    <!-- 3º Juego GlassTower-->
     <div id="screenGlassTower" class="mobile-screen" style="padding: 15px; text-align: center; color: white; background-color: #1a1a1a; display: none;">

  <div id="personalStatsCard" style="background: linear-gradient(135deg, #6f42c1, #43227a); padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
    <h3 style="margin: 0 0 5px 0; font-size: 1.1rem; opacity: 0.9;">⭐ Tu Rendimiento ⭐</h3>
    <h2 id="mobileBestTime" style="margin: 5px 0; font-size: 1.8rem; color: #fff;">Tu récord: --</h2>
    <div id="mobileAttemptsList" style="font-size: 0.9rem; opacity: 0.8; margin-top: 5px;">
      Intentos: [-s] [-s] [-s]
    </div>
  </div>

  <hr style="border-color: #333;">

  <div style="margin-top: 20px;">
    <h3 style="color: #ffc107; margin-bottom: 10px;">⚡ TOP TIEMPOS EN VIVO ⚡</h3>
    <div id="mobileVasosLeaderboard" style="background: #222; border-radius: 8px; padding: 10px; text-align: left; max-height: 250px; overflow-y: auto;">
      <p style="text-align: center; color: #888;">Cargando tiempos...</p>
    </div>
  </div>

</div>
</body>

</html>
