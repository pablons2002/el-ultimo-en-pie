<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>El último en πe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="images/iconoWeb.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1, , viewport-fit=cover">
</head>

<body>

  <!-- Conexión a Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPpKax_7zzPteOtnnutKX6anU6xqgfoMw",
      authDomain: "el-ultimo-en-pie-matematikos.firebaseapp.com",
      projectId: "el-ultimo-en-pie-matematikos",
      storageBucket: "el-ultimo-en-pie-matematikos.firebasestorage.app",
      messagingSenderId: "984317427914",
      appId: "1:984317427914:web:c9fcf803d20186494b3433"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
  </script>

  <script type="module" src="tv.js"></script>

  <!-- Header TV-->
  <header id="userHeader">
    <img src="images/iconoWeb.svg" width="40">
    <!-- Botón de reset en el footer -->
    <button id="selfDestruct">💣 Autodestrucción</button>
  </header>

  <div id="screenSelect">
    <!-- Inicio del programa, pantalla inicial, intro (falta)-->
    <div id="screenIntro" class="screen">
      <h1 style="font-size: 50px; color: #00e676;">
        El último en π(e)
      </h1>
    </div>

    <!-- QR para que entren desde el móvil, crear QR (falta)-->
    <div id="screenJoin" class="screen">
      <img src="img/qr-movil.png" alt="QR versión móvil" width="250">
      <p style="font-size: 18px; margin-top: 20px;">Escanea el código QR para unirte desde tu móvil y elije un
        personaje.
      </p>
    </div>


    <!-- LOBBY (jugadores) -->
    <div id="screenLobby" class="screen">
      <h2> Concursantes</h2>
      <div id="playersList"></div>

      <button id="startBtn"> Empezar concurso</button>
    </div>
  </div>

  <!-- ROULETTE  falta poner la ruleta y que acabe en worldguessr -->
  <div id="screenRoulette" class="screen" style="display: none;">
    <h2> Ruleta de juegos</h2>
    <div id="rouletteContainer"></div> <!--Aquí va la ruleta-->
    <button id="spinBtn">Girar ruleta</button>
  </div>

  <!-- Juego 1º WorldGuessr -->
  <div id="screenWorldGuessr" style="display: none;">
    <iframe src="https://www.worldguessr.com" width="600" height="400"></iframe>
    <div id="overlayImg" style="display:none;">
      <img id="imgShow">
    </div>
    <button id="endGameBtn">Finalizar partida</button>
    <div id="finalizePanel">
      <h3>Finalizar partida</h3>
      <div id="playersContainer"></div>

      <button id="confirmRanking">Confirmar ranking</button>
    </div>
  </div>
  <div id="screenRanking"></div>







  



</body>

</html>
